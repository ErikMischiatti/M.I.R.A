name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libpulse0

      - name: Install project and test dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile package
        run: python -m compileall mira

      - name: Check layering
        run: python scripts/check_layering.py

      - name: Check state authority
        run: python scripts/check_state_authority.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native runtime and test dependencies
        run: python -m pip install -c constraints.txt -e ".[dev,windows]"
      - name: Compile and check architecture
        run: |
          python -m compileall -q mira
          python scripts/check_layering.py
          python scripts/check_state_authority.py
      - name: Native IPC and portable contract regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q tests/test_native_desktop.py tests/test_qt_scheduler_adapter.py
          tests/test_platform_adapters.py tests/test_desktop_platform.py
          tests/test_rule_intent_engine.py tests/test_llm_intent_engine.py
          tests/test_response_builder.py tests/test_memory_contracts.py
          tests/test_messaging_contracts.py tests/test_embodiment_frame.py
          tests/test_scheduler_contracts.py tests/test_consolidated_lifecycle.py
