name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install project and test dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile package
        run: python -m compileall mira

      - name: Check layering
        run: python scripts/check_layering.py

      - name: Check state authority
        run: python scripts/check_state_authority.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
